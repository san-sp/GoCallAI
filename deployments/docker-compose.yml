services:
  postgres:
    image: postgres:17
    container_name: gocallai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gocallai
      POSTGRES_USER: gocallai
      POSTGRES_PASSWORD: gocallai_dev
    ports:
      - "5438:5432"
    volumes:
      - gocallai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocallai -d gocallai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gocallai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - gocallai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gocallai-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://gocallai:gocallai_dev@postgres:5432/gocallai?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  gocallai_postgres_data:
  gocallai_redis_data:
